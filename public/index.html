<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>YOURS</title>
  <meta name="description" content="YOURS - cycle-synced fitness coaching for women. For your body.">
  <meta name="theme-color" content="#F9F7F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14160F" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="YOURS">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232F3720'/%3E%3Ctext x='32' y='44' font-family='Arial Black,Arial' font-weight='900' font-size='34' text-anchor='middle' fill='%23F9F7F4'%3Ey.%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="img/logo.png" as="image">
  <link rel="preload" href="fonts/anton.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/instrument-serif-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { var t = localStorage.getItem('yours.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <!-- Opening splash: the logo full screen, then a fade into the app. Once per visit. -->
  <div id="splash" class="splash" aria-hidden="true"><img src="img/logo.png" alt="" width="1330" height="405"></div>
  <script>
    (function () {
      var el = document.getElementById('splash');
      var seen = false;
      try { seen = sessionStorage.getItem('yours.splash') === '1'; sessionStorage.setItem('yours.splash', '1'); } catch (e) {}
      if (seen) { el.remove(); return; }
      var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      setTimeout(function () {
        el.classList.add('out');
        setTimeout(function () { el.remove(); }, calm ? 250 : 800);
      }, calm ? 600 : 2200);
    })();
  </script>
  <div id="app" class="app"></div>
  <script src="config.js"></script>
  <script src="cloud.js"></script>
  <script src="data.js"></script>
  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
